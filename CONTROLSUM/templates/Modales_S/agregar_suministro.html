<style>
    #modalSuministro .form-control, 
    #modalSuministro .form-select {
        height: 42px;
        border-radius: 12px !important;
        border: 1px solid #e2e8f0;
        background-color: #ffffff !important;
        font-size: 0.9rem;
        transition: all 0.2s ease;
    }
    #modalSuministro .form-control:focus, 
    #modalSuministro .form-select:focus {
        border-color: #1d4ed8;
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        outline: none;
    }
    #modalSuministro .form-label {
        color: #0b2f52;
        font-weight: 600;
        font-size: 0.75rem;
        margin-bottom: 4px;
        letter-spacing: 0.3px;
    }
    #modalSuministro .card-section {
        background-color: #f8fbff;
        border: 1px solid #eef2ff !important;
        border-radius: 16px;
        transition: transform 0.2s ease;
    }
    #modalSuministro .img-preview-box {
        border: 2px dashed #cbd5e1;
        background-color: #ffffff;
        transition: all 0.2s ease;
    }
    #modalSuministro .img-preview-box:hover {
        border-color: #94a3b8;
    }
</style>

<div class="modal fade" id="modalSuministro" tabindex="-1" aria-labelledby="modalSuministroLabel" aria-hidden="true"
    data-bs-keyboard="false" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">
            <!-- Premium Header -->
            <div class="modal-header border-0 p-3 px-4" style="background: linear-gradient(135deg, #0b2f52 0%, #1d3f8f 100%);">
                <div class="d-flex align-items-center">
                    <div class="bg-white bg-opacity-10 rounded-3 p-2 me-3">
                        <i class="fas fa-boxes text-white fs-5"></i>
                    </div>
                    <div>
                        <h5 class="modal-title text-white fw-bold mb-0" id="modalSuministroLabel" style="letter-spacing: 0.5px; font-size: 1.1rem;">Crear Nuevo Suministro</h5>
                        <p class="text-white text-opacity-75 mb-0 small" style="font-size: 0.75rem;">Control de registro de productos</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form id="formSuministro" enctype="multipart/form-data">
                <div class="modal-body p-3 px-4" style="background-color: #ffffff;">
                    
                    <!-- Section 1: Información General -->
                    <div class="card card-section shadow-sm mb-3">
                        <div class="card-header bg-transparent border-0 pt-3 pb-2 px-3">
                            <h6 class="mb-0 fw-bold text-primary small text-uppercase" style="font-size: 0.7rem;"><i class="fas fa-info-circle me-2"></i>Información General</h6>
                        </div>
                        <div class="card-body pt-0 px-3 pb-3">
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label text-uppercase">Nombre del Suministro</label>
                                    <input type="text" class="form-control" id="nombre_sum" name="nombre_sum" placeholder="Ej: Resmas de Papel Bond">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-uppercase">Descripción</label>
                                    <textarea class="form-control" id="descripcion" name="descripcion" rows="1" placeholder="Detalles adicionales..."></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-uppercase">Categoría</label>
                                    <select id="categoria" class="form-select" name="categoria">
                                        <option value="#">Seleccione la categoría:</option>
                                        {% for cat in categorias %}
                                        <option value="{{ cat.id_categoria }}">{{ cat.nombre_categoria }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-uppercase">Almacén</label>
                                    <select id="almacen_suministro" class="form-select" name="almacen_suministro">
                                        <option value="#">Cargando almacén...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-uppercase">Acreedor</label>
                                    <select id="acreedor" class="form-select" name="acreedor">
                                        <option value="#">Seleccione el acreedor:</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-uppercase">Grupo</label>
                                    <select id="area" class="form-select" name="area">
                                        <option value="#">Cargando grupos...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-uppercase">Fecha de Adquisición</label>
                                    <input type="date" class="form-control" id="fecha_adquisicion" name="fecha_adquisicion">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Stock y Precios -->
                    <div class="card card-section shadow-sm mb-3">
                        <div class="card-header bg-transparent border-0 pt-3 pb-2 px-3">
                            <h6 class="mb-0 fw-bold text-primary small text-uppercase" style="font-size: 0.7rem;"><i class="fas fa-layer-group me-2"></i>Stock y Precios</h6>
                        </div>
                        <div class="card-body pt-0 px-3 pb-3">
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <label class="form-label text-uppercase">Cant. Inicial</label>
                                    <input type="number" class="form-control" id="cantidad_inicial" name="cantidad_inicial" min="0" oninput="validateNumberInput(this)">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-uppercase">Cant. Stock</label>
                                    <input type="number" class="form-control" id="cantidad_stock" name="cantidad_stock" min="0" oninput="validateNumberInput(this)">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-uppercase">Cant. Mínima</label>
                                    <input type="number" class="form-control" id="cantidad_minima" name="cantidad_minima" min="1" oninput="validateNumberInput(this)">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-uppercase">Precio Unit.</label>
                                    <input type="number" class="form-control" id="precio_unitario" name="precio_unitario" min="0" step="0.01" oninput="validateNumberInput(this)">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Imagen del Suministro -->
                    <div class="card card-section shadow-sm mb-1">
                        <div class="card-header bg-transparent border-0 pt-3 pb-2 px-3">
                            <h6 class="mb-0 fw-bold text-primary small text-uppercase" style="font-size: 0.7rem;"><i class="fas fa-image me-2"></i>Imagen del Suministro</h6>
                        </div>
                        <div class="card-body pt-0 px-3 pb-3">
                            <div class="row align-items-center g-3">
                                <div class="col-md-7">
                                    <input type="hidden" name="imagen_actual" id="imagen_actual">
                                    <label class="form-label text-uppercase">Seleccionar Archivo</label>
                                    <input type="file" class="form-control pt-2" id="imagen_suministro" name="imagen_suministro" accept="image/*" onchange="previewImage(event)">
                                </div>
                                <div class="col-md-5">
                                    <div id="imagen_preview" class="img-preview-box d-flex flex-column align-items-center justify-content-center p-2 rounded-3" style="min-height: 100px;">
                                        <img id="imagenActual" src="#" alt="Vista previa" class="img-fluid shadow-sm"
                                            style="display: none; max-height: 80px; width: auto; border-radius: 8px;">
                                        <div id="no_imagen" class="text-center">
                                            <i class="fas fa-image text-muted opacity-25 fs-2 mb-1"></i>
                                            <p class="mb-0 text-muted" style="font-size: 0.65rem;">Sin imagen seleccionada</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-0 p-3 px-4 justify-content-center gap-3" style="background-color: #f8fafc;">
                    <button type="button" class="btn btn-outline-danger px-4 fw-bold" data-bs-dismiss="modal" style="border-radius: 50px; height: 42px; min-width: 140px;">
                        <i class="fas fa-times me-2"></i>Cancelar
                    </button>
                    <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm" style="border-radius: 50px; height: 42px; min-width: 180px; background: #10b981; border: none;">
                        <i class="fas fa-save me-2"></i>Guardar Suministro
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Función para mostrar la vista previa de la imagen seleccionada
    function previewImage(event) {
        var file = event.target.files[0]; // Obtener el archivo seleccionado
        if (file && file.type.startsWith('image/')) { // Verificar si es una imagen
            var reader = new FileReader();

            // Cuando el archivo esté cargado, actualizar la vista previa
            reader.onload = function () {
                var output = document.getElementById('imagenActual');
                output.src = reader.result;
                output.style.display = 'block';  
                document.getElementById('no_imagen').style.display = 'none';  
            };

            reader.readAsDataURL(file); 
        } else {
            alert('Por favor selecciona una imagen válida');
        }
    }

    // Limpiar el campo de imagen y la vista previa al cerrar el modal
    var modal = document.getElementById('modalSuministro');
    modal.addEventListener('hidden.bs.modal', function () {
        // Limpiar el campo de entrada de la imagen
        document.getElementById('imagen_suministro').value = '';

        // Ocultar la vista previa de la imagen
        document.getElementById('imagenActual').style.display = 'none';
        document.getElementById('no_imagen').style.display = 'block'; 
    });

    // Función para validar la entrada y permitir solo números
    function validateNumberInput(input) {
        // Elimina cualquier carácter que no sea un número o un punto (para decimales)
        input.value = input.value.replace(/[^0-9.]/g, '');

        // Permite solo un punto decimal
        if ((input.value.match(/\./g) || []).length > 1) {
            input.value = input.value.replace(/\.(?=.*\.)/, ''); // Elimina el segundo punto decimal
        }
    }

</script>
