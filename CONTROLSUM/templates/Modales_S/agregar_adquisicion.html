            </style>
            <form id="formAdquisicion">
                <div class="modal-body p-3">
                    <div class="container-fluid">
                        
                        <!-- Sección 1: Información General -->
                        <div class="section-card">
                            <div class="section-title">
                                <i class="fas fa-info-circle text-primary"></i> Información General de la Adquisición
                            </div>
                            <div class="row g-4">
                                <div class="col-md-2">

                                <div class="col-md-4">

                                        <label for="solicitante" class="form-label">Requisición del Solicitante:</label>

                                </div>

                                <div class="col-md-3">
                                    <div class="form-group">

                        <!-- Sección 2: Detalle de Suministros -->

                                <i class="fas fa-box-open text-primary"></i> Detalle de Suministros a Adquirir

                                    <thead>
                                        <tr>

<script>

    var global_id_requisicion
    function ObtenerDetallesRequisicion() {
        const dollarUSLocale = Intl.NumberFormat("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        const intergerLocale = Intl.NumberFormat("en-US", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });

        var id_requisicion = $("#solicitante").find('option:selected').val();
        global_id_requisicion = id_requisicion
        var id_solicitante_seleccionado = $("#solicitante").find('option:selected').data('PKUsuario'); 
        var nombre = $("#solicitante").find('option:selected').data('nombre'); 
        
        // console.log("=== INICIO DE SELECCION REQUISICION ===");
        // console.log("Valor ID Requisición seleccionado en el select:", id_requisicion);
        // console.log("Payload enviado por AJAX:", { pk_usuario: 0, id_requisicion: id_requisicion });

        if (id_solicitante_seleccionado !== "#") {

            $.ajax({
                url: "{% url 'obtener_requisicion_detalles_usuario' %}", 
                type: 'GET',
                data: {
                    pk_usuario: 0,  
                    id_requisicion: id_requisicion  
                },
                success: function(response) {
                    console.log("Respuesta AJAX backend:", response);

                    // Verificar si la respuesta es exitosa
                    if (response.success && response.data) {
                        // Actualizar los campos de grupo y proveedor
                        $('#id_requisicion').val(id_requisicion || '');
                        $('#grupos').val(response.data.grupo || ''); 
                        $('#grupos').data('id', response.data.grupo_id || '');  
                        $('#proveedor').val(response.data.proveedor || '');  
                        $('#proveedor').data('id', response.data.id_proveedor || ''); 

                        // Verificar si existen detalles de requisición
                        if (response.data.detalles && Array.isArray(response.data.detalles) && response.data.detalles.length > 0) {
                            let tablaArticulos = '';
                            let costoTotal = 0;

                            // Iterar sobre los detalles y crear las filas de la tabla
                            response.data.detalles.forEach(function(articulo) {
                                const id_dr = articulo.id_detalle_requisicion || articulo.FKRequisicion || articulo.PKDetalleRequisicion || "";
                                const cantidad = articulo.cantidad !== undefined ? articulo.cantidad : (articulo.Cantidad !== undefined ? articulo.Cantidad : 0);
                                const precioUnitario = parseFloat(articulo.precio_unitario || articulo.PrecioUnitario || 0); 
                                const id_sum = articulo.id_suministros || articulo.FKSuministros || articulo.id_suministro || "";
                                const precioTotal = cantidad * precioUnitario;

                                tablaArticulos += `
                                    <tr data-id-dr="${id_dr}" data-id-sum="${id_sum}">
                                        <td class="text-center">${articulo.id_detalle_requisicion || ''}</td>
                                        <td style="display: none">${id_sum}</td>
                                        <td>${articulo.nombre_suministro || ''}</td>
                                        <td class="text-center">${cantidad}</td>
                                        <td class="text-end">L\u00A0${dollarUSLocale.format(precioUnitario)}</td>
                                        <td class="text-end">L\u00A0${dollarUSLocale.format(precioTotal)}</td>
                                    </tr>
                                `;
                                costoTotal += precioTotal;
                            });

                            // Actualizar el contenido de la tabla y el costo total
                            $('#tabla-articulos').html(tablaArticulos);
                            $('#costo-total').html(dollarUSLocale.format(costoTotal));
                        } else {
                            Swal.fire("", "No se encontraron artículos para esta requisición.", "warning");
                        }

                    } else {
                        console.error('Error lógico en el backend:', response.message);
                        alert('No se pudieron obtener los detalles de la requisición seleccionada.');
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error CRÍTICO AJAX:', error, xhr.responseText);
                    $('#solicitante').prop('disabled', false);
                    alert('Hubo un error al obtener los detalles: ' + error);
                }
            });
        }
    }

    function CargarDetallesAdquisicion(response) {
        const dollarUSLocale = Intl.NumberFormat("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        if (response.detalles && Array.isArray(response.detalles)) {
            let tablaArticulos = '';
            let costoTotal = 0;

            response.detalles.forEach(function(detalle) {
                const cantidadVal = detalle.cantidad !== undefined ? detalle.cantidad : (detalle.Cantidad !== undefined ? detalle.Cantidad : 0);
                const precioUnitarioVal = parseFloat(detalle.precio_unitario || detalle.PrecioUnitario || 0);
                const id_sum = detalle.id_suministros || detalle.FKSuministros || detalle.id_suministro || "";
                const id_dr = detalle.id_detalle_requisicion || detalle.FKRequisicion || "";
                const id_da = detalle.id_detalle_adquisicion || detalle.PKDetalleAdquisicion || "";
                
                const precioTotalVal = cantidadVal * precioUnitarioVal;

                tablaArticulos += `
                    <tr data-id-da="${id_da}" data-id-dr="${id_dr}" data-id-sum="${id_sum}">
                        <td class="text-center">${id_da || id_dr || ''}</td>
                        <td style="display: none">${id_sum}</td>
                        <td>${detalle.nombre_suministro || detalle.NombreSuministro || ''}</td>
                        <td class="text-center" data-original-cantidad="${cantidadVal}">${Math.abs(cantidadVal)}</td>
                        <td class="text-end" data-original-precio="${precioUnitarioVal}">L\u00A0${dollarUSLocale.format(Math.abs(precioUnitarioVal))}</td>
                        <td class="text-end">L\u00A0${dollarUSLocale.format(Math.abs(precioTotalVal))}</td>
                    </tr>
                `;
                costoTotal += precioTotalVal;
            });

            $('#tabla-articulos').html(tablaArticulos);
            $('#costo-total').html(dollarUSLocale.format(Math.abs(costoTotal)));
        }
    }

    $('#modalAdquisicion').on('shown.bs.modal', function (e) {
        if ($.fn.select2 && $('#solicitante').hasClass('select2-hidden-accesible')) {
            $('#solicitante').select2('destroy');
        }

        $('#solicitante').select2({
            placeholder: "Seleccione al solicitante",
            width: "100%",
            allowClear: false,
            dropdownParent: $('#modalAdquisicion')
        });
    });

</script>
